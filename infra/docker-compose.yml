version: '3.9'

services:
  auditi-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: auditi-app
    restart: unless-stopped
    ports:
      - '3100:3000'
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://auditi-redis:6379
    depends_on:
      auditi-redis:
        condition: service_healthy
    networks:
      - auditi-net

  auditi-worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: auditi-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://auditi-redis:6379
    depends_on:
      auditi-redis:
        condition: service_healthy
    networks:
      - auditi-net

  auditi-redis:
    image: redis:7-alpine
    container_name: auditi-redis
    restart: unless-stopped
    volumes:
      - auditi-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - auditi-net


volumes:
  auditi-redis-data:

networks:
  auditi-net:
    driver: bridge
